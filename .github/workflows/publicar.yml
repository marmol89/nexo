# Publica una versión cuando se fusiona la PR de versión (rama release/next, creada por preparar-version.yml).
# Nada se publica al subir código ni etiquetas a mano: solo al fusionar esa PR.
#   1. etiqueta v<versión> sobre el commit fusionado (versión de Nexo/Nexo.toc)
#   2. genera el .zip con herramientas/Empaquetar.ps1
#   3. crea la versión en GitHub con el .zip adjunto
#   4. lo sube a CurseForge, si el proyecto está configurado
#
# Para el paso 4 hacen falta, en Settings > Secrets and variables > Actions:
#   secreto   CF_API_KEY        token de https://authors.curseforge.com/account/api-tokens
#   variable  CF_PROJECT_ID     número de proyecto (Project ID, en la página del proyecto)
#   variable  CF_GAME_VERSION   versión de juego tal como la llama CurseForge; varias, separadas por comas
#   variable  CF_RELEASE_TYPE   release (por defecto), beta o alpha
# Sin CF_API_KEY o CF_PROJECT_ID el paso 4 se salta y lo demás funciona igual.
name: Publicar

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  publicar:
    # Solo las PR de versión fusionadas desde este mismo repositorio
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'release/next'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Leer la versión de Nexo.toc y comprobar que no existe ya
        id: version
        run: |
          version="$(sed -n 's/^## *Version: *//p' Nexo/Nexo.toc | tr -d '\r' | head -n1)"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Ya existe la etiqueta $tag. Sube el número de versión en Nexo/Nexo.toc."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "zip=dist/Nexo-$version.zip" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generar el .zip
        shell: pwsh
        run: ./herramientas/Empaquetar.ps1

      - name: Escribir los cambios desde la versión anterior
        run: |
          anterior="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"
          if [ -n "$anterior" ]; then rango="$anterior..HEAD"; else rango="HEAD"; fi
          git log --no-merges --pretty='- %s' "$rango" > cambios.md
          cat cambios.md

      - name: Crear la versión en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.zip }}" \
            --target "${{ steps.version.outputs.sha }}" \
            --title "Nexo ${{ steps.version.outputs.version }}" --notes-file cambios.md

      - name: Subir a CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION }}
          CF_RELEASE_TYPE: ${{ vars.CF_RELEASE_TYPE || 'release' }}
          ZIP: ${{ steps.version.outputs.zip }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$CF_API_KEY" ] || [ -z "$CF_PROJECT_ID" ]; then
            echo "::notice::CurseForge sin configurar (CF_API_KEY, CF_PROJECT_ID): no se sube."
            exit 0
          fi
          api="https://wow.curseforge.com/api"

          # CurseForge pide el número de cada versión de juego, no su nombre
          curl -fsS -H "X-Api-Token: $CF_API_KEY" "$api/game/versions" > versiones.json
          ids="$(jq -c --arg nombres "$CF_GAME_VERSION" '
            ($nombres | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))) as $n
            | [ .[] | select(.name as $x | $n | index($x)) | .id ]' versiones.json)"
          if [ "$ids" = "[]" ]; then
            echo "::error::CF_GAME_VERSION ('$CF_GAME_VERSION') no coincide con ninguna versión de juego de CurseForge."
            echo "Las más recientes que ofrece:"
            jq -r 'sort_by(.id) | reverse | .[:40][] | "  \(.name)"' versiones.json
            exit 1
          fi

          jq -n --rawfile cambios cambios.md --arg nombre "Nexo $VERSION" \
                --arg tipo "$CF_RELEASE_TYPE" --argjson versiones "$ids" \
            '{changelog: $cambios, changelogType: "markdown", displayName: $nombre,
              gameVersions: $versiones, releaseType: $tipo}' > metadatos.json

          curl -fsS -H "X-Api-Token: $CF_API_KEY" \
            -F "metadata=<metadatos.json" -F "file=@$ZIP" \
            "$api/projects/$CF_PROJECT_ID/upload-file"
          echo
          echo "Subido a CurseForge: Nexo $VERSION"
